name: Deploy portal

# Publishes portal/ (a static page with no data in it) to GitHub Pages. Each
# visitor signs in with their own data repo and token, kept in their browser.
on:
  push:
    branches: [main]
    paths: ["portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal
      - id: deploy
        uses: actions/deploy-pages@v4
