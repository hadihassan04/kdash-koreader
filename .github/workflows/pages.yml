name: Deploy portal

# Publishes the companion page (generator/portal/) on this repo's GitHub Pages,
# for the data repo named in the KDASH_DATA_REPO variable (or, without it, any
# data repo: it asks which). Data repos publish their own copy (generator/.github/).
on:
  push:
    branches: [main]
    paths: ["generator/portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The data repo to use, from the KDASH_DATA_REPO repository variable
      # (owner/name). Unset, the page asks for one.
      - run: sed -i "s|__KDASH_REPO__|${{ vars.KDASH_DATA_REPO || '-' }}|" generator/portal/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: generator/portal
      - id: deploy
        uses: actions/deploy-pages@v4
