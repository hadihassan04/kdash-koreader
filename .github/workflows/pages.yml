name: Deploy portal

# Publishes the companion page (generator/portal/) on this repo's GitHub Pages,
# for anyone to use with their own data repo: it asks for the repo and a token,
# kept in the browser. Data repos publish their own copy (generator/.github/).
on:
  push:
    branches: [main]
    paths: ["generator/portal/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Not a data repo: the page asks which repo to use
      - run: sed -i "s|__KDASH_REPO__|-|" generator/portal/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: generator/portal
      - id: deploy
        uses: actions/deploy-pages@v4
